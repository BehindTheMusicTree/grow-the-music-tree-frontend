name: PR Type Labeler

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-by-type:
    runs-on: ubuntu-latest
    steps:
      - name: Label PR by title and description
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const body = pr.body || '';
            const labels = [];

            // Detect type from title prefix (conventional commits)
            if (title.startsWith('feat') || title.startsWith('feature')) {
              labels.push('feature');
            } else if (title.startsWith('fix')) {
              labels.push('bug');
            } else if (title.startsWith('docs')) {
              labels.push('documentation');
            } else if (title.startsWith('refactor')) {
              labels.push('refactor');
            } else if (title.startsWith('perf')) {
              labels.push('performance');
            } else if (title.startsWith('style')) {
              labels.push('enhancement');
            } else if (title.startsWith('chore')) {
              // Check for dependency-related PRs more specifically
              // Only label as dependencies if title/description explicitly mentions dependency updates
              // Avoid false positives from template checklist text
              const titleHasDeps = title.includes('dependenc') || title.includes('package') || title.includes('npm') || title.includes('yarn');
              const bodyHasDepsUpdate = body.match(/update.*dependenc/i) || 
                                        body.match(/upgrade.*dependenc/i) ||
                                        body.match(/bump.*dependenc/i) ||
                                        body.match(/dependabot/i) ||
                                        body.match(/package\.json/i) ||
                                        body.match(/package-lock/i);
              
              if (titleHasDeps || bodyHasDepsUpdate) {
                labels.push('dependencies');
              }
            }

            // Detect breaking changes
            // Check for '!' in title (Conventional Commits breaking change indicator)
            // Check for checked breaking change checkbox
            // Check for "BREAKING CHANGE:" in body (Conventional Commits format)
            // Check for real content in the Breaking Changes section (not just the
            // template header, its HTML-comment placeholder, or a "None"/"N/A" filler)
            const hasBreakingInTitle = title.includes('!');
            const hasCheckedBreakingCheckbox = body.includes('[x] 💥 Breaking change') || body.includes('[X] 💥 Breaking change');
            const hasBreakingChangeNote = body.includes('BREAKING CHANGE:') || /BREAKING CHANGE\s*:/i.test(body);
            const breakingChangesMatch = body.match(/## Breaking Changes\s*\n([\s\S]*?)(?=\n## |$)/i);
            const breakingChangesContent = breakingChangesMatch
              ? breakingChangesMatch[1].replace(/<!--[\s\S]*?-->/g, '').trim()
              : '';
            const hasBreakingChangesSection = breakingChangesContent.length > 0 &&
              !/^(none|n\/a|na)\.?$/i.test(breakingChangesContent);

            if (hasBreakingInTitle || hasCheckedBreakingCheckbox || hasBreakingChangeNote || hasBreakingChangesSection) {
              labels.push('breaking-change');
            }

            // Detect specific PR types from body
            if (body.includes('[x] Bug fix') || body.includes('[X] Bug fix')) {
              if (!labels.includes('bug')) labels.push('bug');
            }
            if (body.includes('[x] New feature') || body.includes('[X] New feature')) {
              if (!labels.includes('feature')) labels.push('feature');
            }
            if (body.includes('[x] Code refactoring') || body.includes('[X] Code refactoring')) {
              if (!labels.includes('refactor')) labels.push('refactor');
            }
            if (body.includes('[x] Documentation update') || body.includes('[X] Documentation update')) {
              if (!labels.includes('documentation')) labels.push('documentation');
            }
            if (body.includes('[x] Performance improvement') || body.includes('[X] Performance improvement')) {
              if (!labels.includes('performance')) labels.push('performance');
            }

            // Apply labels
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
