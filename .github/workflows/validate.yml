# Deployment is handled by Coolify (auto-deploy on push to develop/main), not by this workflow — see docs/DEPLOYMENT.md.
# pnpm install needs GH_PACKAGES_TOKEN: GITHUB_TOKEN cannot read @behindthemusictree/* when published from another repo (403 read_package).
name: Validate

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

env:
  NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}

jobs:
  ensure-packages-token:
    name: GitHub Packages token
    runs-on: ubuntu-latest
    steps:
      - name: Require GH_PACKAGES_TOKEN secret
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Repository secret GH_PACKAGES_TOKEN is required. Add a GitHub PAT with read:packages (and org SSO if applicable) so pnpm install can install @behindthemusictree/*. GITHUB_TOKEN cannot read packages published from other repositories (403 permission_denied: read_package)."
            exit 1
          fi

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: [ensure-packages-token]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: [ensure-packages-token]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:coverage

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

  grow-api-contract:
    name: grow-api contract (prod)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read required grow-api version
        id: grow-api
        run: echo "min_version=$(jq -er .growApi.minVersion package.json)" >> "$GITHUB_OUTPUT"

      - name: Require prod grow-api at or above the version this release needs
        uses: BehindTheMusicTree/github-workflows/.github/actions/check-api-version@v4.7.0
        with:
          health_url: https://grow-api.${{ vars.DOMAIN_NAME }}/health/
          min_version: ${{ steps.grow-api.outputs.min_version }}
