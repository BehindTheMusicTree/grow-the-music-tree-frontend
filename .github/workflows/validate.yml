# Deployment is handled by Coolify (auto-deploy on push to develop/main), not by this workflow — see docs/DEPLOYMENT.md.
name: Validate

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test:coverage

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

  grow-api-contract:
    name: grow-api contract (prod)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read required grow-api version
        id: grow-api
        run: echo "min_version=$(jq -er .growApi.minVersion package.json)" >> "$GITHUB_OUTPUT"

      - name: Require production origin
        env:
          ORIGIN_IP: ${{ vars.APP_ORIGIN_IP }}
        run: test -n "$ORIGIN_IP" || { echo '::error::APP_ORIGIN_IP is required'; exit 1; }

      - name: Require prod grow-api at or above the version this release needs
        uses: BehindTheMusicTree/github-workflows/.github/actions/check-api-version@v4.9.0
        with:
          health_url: https://grow-api.${{ vars.DOMAIN_NAME }}/health/
          min_version: ${{ steps.grow-api.outputs.min_version }}
          origin_ip: ${{ vars.APP_ORIGIN_IP }}
