# One-off helper: regenerates pnpm-lock.yaml on the runner and pushes it back to the
# dispatched branch. Removed once chore/consume-ui-package's lockfile is back in sync.
name: Fix Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lockfile:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN_READ }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "chore: regenerate lockfile"
            git push
          fi
